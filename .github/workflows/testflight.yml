# Manual TestFlight release workflow.
#
# This workflow is **disabled by default** (manual dispatch only). To enable
# automatic releases on push to `main`, uncomment the `push:` trigger below.
#
# Required repository secrets:
#   APP_STORE_CONNECT_API_KEY_ID         — App Store Connect API Key ID
#   APP_STORE_CONNECT_API_ISSUER_ID      — App Store Connect Issuer ID
#   APP_STORE_CONNECT_API_KEY_BASE64     — base64 of the .p8 key file
#   IOS_BUNDLE_ID                        — e.g. com.senolop.calculator
#   BUILD_CERTIFICATE_BASE64             — Distribution .p12 (base64)
#   P12_PASSWORD                         — password for the .p12
#   KEYCHAIN_PASSWORD                    — temporary keychain password
#   PROVISIONING_PROFILE_BASE64          — App Store provisioning profile (base64)
#
# See: https://docs.github.com/en/actions/deployment/deploying-xcode-applications/installing-an-apple-certificate-on-macos-runners-for-xcode-development

name: TestFlight

on:
  workflow_dispatch:
  # push:
  #   branches: [ "main" ]
  #   tags: [ "v*" ]

permissions:
  contents: read

jobs:
  release:
    name: Archive & upload to TestFlight
    runs-on: macos-latest
    environment: production

    steps:
      - uses: actions/checkout@v6

      - name: Install Apple certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD:             ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD:        ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH=$RUNNER_TEMP/build_cert.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build & archive
        run: |
          xcodebuild -project SenolopApp.xcodeproj \
                     -scheme Senolop \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath "$RUNNER_TEMP/Senolop.xcarchive" \
                     archive

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
                     -archivePath "$RUNNER_TEMP/Senolop.xcarchive" \
                     -exportPath "$RUNNER_TEMP/export" \
                     -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload to TestFlight
        env:
          ASC_API_KEY_ID:    ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_API_KEY_BASE64" | base64 --decode \
            -o ~/.appstoreconnect/private_keys/AuthKey_${ASC_API_KEY_ID}.p8
          IPA=$(ls "$RUNNER_TEMP/export"/*.ipa | head -1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_API_KEY_ID" --apiIssuer "$ASC_API_ISSUER_ID"
