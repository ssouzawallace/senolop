# Build and (when a test target exists) test the Senolop scheme.

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Build
      run: |
        xcodebuild clean build \
          -project SenolopApp.xcodeproj \
          -scheme Senolop \
          -destination 'platform=iOS Simulator,name=iPhone 16' \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

    - name: Test (only if a test target exists)
      run: |
        if xcodebuild -project SenolopApp.xcodeproj -list | grep -qE '^\s+SenolopTests\s*$'; then
          xcodebuild test \
            -project SenolopApp.xcodeproj \
            -scheme Senolop \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        else
          echo "No SenolopTests target configured in the Xcode project — skipping tests."
        fi

